<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sky4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="35%" stop-color="#be185d" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  <!-- Fiery Sunset Sky -->
  <rect width="800" height="600" fill="url(#sky4)" />
  <!-- Giant Glowing Sunset Orb -->
  <circle cx="500" cy="380" r="100" fill="#fbbf24" opacity="0.9" filter="drop-shadow(0 0 40px #f97316)" />
  <!-- Distant mountain ridges -->
  <polygon points="0,520 220,380 440,540 680,360 800,480 800,600 0,600" fill="#3b0764" opacity="0.7" />
  <!-- Summit Crest Ridge -->
  <polygon points="0,600 0,460 300,400 520,440 800,380 800,600" fill="#18022e" />
  <!-- Two Hikers looking out at sunset silhouettes -->
  <!-- Hiker 1 (Alisha) -->
  <circle cx="480" cy="415" r="7" fill="#fb923c" />
  <line x1="480" y1="422" x2="480" y2="440" stroke="#fb923c" stroke-width="5" stroke-linecap="round" />
  <line x1="476" y1="428" x2="472" y2="444" stroke="#fb923c" stroke-width="2" />
  <!-- Hiker 2 (Biswadip) -->
  <circle cx="505" cy="417" r="7" fill="#fde047" />
  <line x1="505" y1="424" x2="505" y2="440" stroke="#fde047" stroke-width="5" stroke-linecap="round" />
  <!-- Summit Cairn & Flag -->
  <line x1="440" y1="380" x2="440" y2="435" stroke="#f59e0b" stroke-width="3" />
  <polygon points="440,380 465,392 440,404" fill="#ef4444" />
</svg>
