<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sky2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#fef9c3" />
    </linearGradient>
    <linearGradient id="meadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>
  <!-- Clear Morning Sky -->
  <rect width="800" height="600" fill="url(#sky2)" />
  <!-- Distant Snow Peak -->
  <polygon points="200,600 400,160 600,600" fill="#94a3b8" opacity="0.6" />
  <polygon points="380,160 400,160 440,250 360,250" fill="#ffffff" />
  <!-- Alpine Meadow Slopes -->
  <path d="M0,450 Q200,380 420,440 T800,410 L800,600 L0,600 Z" fill="url(#meadow)" />
  <path d="M0,520 Q350,470 800,530 L800,600 L0,600 Z" fill="#166534" />
  <!-- Wildflowers Dots -->
  <circle cx="140" cy="530" r="4" fill="#f43f5e" />
  <circle cx="210" cy="510" r="3" fill="#eab308" />
  <circle cx="290" cy="550" r="4" fill="#a855f7" />
  <circle cx="480" cy="520" r="3" fill="#ec4899" />
  <circle cx="620" cy="540" r="4" fill="#facc15" />
  <!-- Wooden Trail Bench / Rest Landmark -->
  <rect x="360" y="470" width="80" height="8" rx="2" fill="#78350f" />
  <rect x="375" y="478" width="6" height="20" fill="#78350f" />
  <rect x="420" y="478" width="6" height="20" fill="#78350f" />
</svg>
